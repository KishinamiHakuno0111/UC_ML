[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-ml"
version = "0.1.0"
description = "ML-assisted acceleration framework for unit commitment."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "torch",
  "openpyxl",
  "requests",
  "pyomo",
  "gurobipy",
]

[project.scripts]
uc-ml = "uc_ml.cli:main"

[tool.setuptools]
packages = ["uc_ml"]
